name: natyakosha
description: Natyakosha - attendance, fees, events, media and theory for classical dance schools.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Env config (react-native-config) ---
  flutter_dotenv: ^5.2.1

  # --- Firebase (react-native-firebase) ---
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5

  # --- State management (redux + react-redux + redux-thunk) ---
  redux: ^5.0.0
  flutter_redux: ^0.10.0
  # Thunk middleware is written in-house (lib/redux/middleware/thunk_middleware.dart)
  # so `await store.dispatch(thunk)` returns the thunk's Future, like redux-thunk.

  # --- HTTP (axios) ---
  dio: ^5.8.0

  # --- Online / offline (@react-native-community/netinfo) ---
  connectivity_plus: ^6.1.3
  internet_connection_checker_plus: ^2.7.1

  # --- Storage (AsyncStorage / Keychain / Realm) ---
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # --- Forms & validation (Formik + Yup) ---
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2

  # --- Navigation (react-navigation) ---
  go_router: ^14.8.1

  # --- Dependency injection ---
  get_it: ^8.0.3

  # --- Media (image-picker / fast-image) ---
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # --- Utilities ---
  equatable: ^2.0.7
  intl: any
  logger: ^2.5.0
  uuid: ^4.5.1
  table_calendar: ^3.2.1
  video_player: ^2.14.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.staging
    - .env.prod
    - assets/images/
